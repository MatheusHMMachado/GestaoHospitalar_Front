services:
  # 1. Contentor da API (C#)
  backend-api:
    build:
      context: ./Backend # Altere aqui se a pasta do seu backend tiver outro nome
      dockerfile: Dockerfile
    container_name: gestao-hospitalar-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=GestaoHospitalar;User Id=sa;Password=@MasterC0DE1;TrustServerCertificate=True;
    restart: unless-stopped

  # 2. Contentor da Interface Web (React)
  frontend-web:
    build:
      context: ./frontend # Altere aqui se a pasta do seu frontend tiver outro nome
      dockerfile: Dockerfile
    container_name: gestao-hospitalar-front
    restart: unless-stopped
    # Variável injetada durante a compilação do React para apontar para o Gateway
    environment:
      - VITE_API_URL=/api

  # 3. Contentor do Gateway (Nginx) - A Porta de Entrada
  gateway:
    image: nginx:alpine
    container_name: gestao-hospitalar-gateway
    ports:
      # A ÚNICA porta exposta para a sua máquina será a 8080
      - "8080:80" 
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend-web
      - backend-api

  # 4. Contentor de Testes do Frontend (Mantivemos para quando precisar)
  frontend-test:
    image: node:20-alpine
    container_name: gestao-hospitalar-test
    profiles: 
      - test # Impede que este contentor inicie automaticamente com os outros
    volumes:
      - ./frontend:/app 
      - /app/node_modules 
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run test"
    environment:
      - CI=true