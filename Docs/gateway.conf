server {
    listen 80;

    # Encaminha tudo o que tiver /api para o contentor do Backend (porta interna 8080)
    location /api/ {
        proxy_pass http://backend-api:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Encaminha o resto para o contentor do Frontend (porta interna 80)
    location / {
        proxy_pass http://frontend-web:80/;
    }
}