server {
    listen 80;
    server_name  localhost;

    #Local dos arquivos estáticos do frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Se não achar o arquivo, devolve o index.html para o React tratar a rota
        try_files $uri $uri/ /index.html;
    }

    # Definição de páginas de erro
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location /api/ {
        # O Nginx atuará como um proxy reverso para o backend, enviando a requisição para a instância correta
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Cabeçalhos adicionais para manter informações do cliente original
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}