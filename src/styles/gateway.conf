server {
    listen 80;

    # Qualquer requisição que comece com /api vai para o container do backend
    location /api/ {
        proxy_pass http://backend-api:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Qualquer outra requisição vai para o container do frontend
    location / {
        proxy_pass http://frontend-web:80/;
    }
}