name: Deploy Frontend to EC2 (Secure)

on:
  push:
    branches:
      - main # Deploy quando entrar na main
      - tests  # Apenas teste de compilação quando entrar na tests

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main' # Só roda se for a branch MAIN
    runs-on: ubuntu-latest
    
    steps:
      - name: Validando alterações no codigo, e arquivo deploy.yml
        uses: actions/checkout@v4

      - name: Configurando credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      - name: Obtendo IP público do GitHub Actions
        id: ip
        run: |
          echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Abrindo porta SSH(Just-in-Time)
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Enviando o deploy para a EC2 e executando o script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "GitHub Actions conectou na EC2..."
            
            # Garante que o script tem permissão de execução
            chmod +x /home/ubuntu/deploy.sh
            
            # Executa o script de deploy na EC2
            /home/ubuntu/deploy.sh

      - name: Fechando porta SSH(Mesmo se falar)
        if: always() # Garante que rode mesmo se o deploy falhar
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32