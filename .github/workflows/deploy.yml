name: Deploy Frontend to EC2

# Gatilho: Roda sempre que houver um push na branch main (ou master)
on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # O script que será executado dentro da EC2
          script: |
            echo "GitHub Actions conectou na EC2..."
            
            # Garante que o script tem permissão de execução
            chmod +x /home/ubuntu/deploy.sh
            
            # Executa o script que criamos anteriormente
            /home/ubuntu/deploy.sh